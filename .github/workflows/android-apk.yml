name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Korean_Shadowing_Studio_Codemagic_Build.zip'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project
        run: |
          unzip -q Korean_Shadowing_Studio_Codemagic_Build.zip -d extracted
          chmod +x extracted/androidproj/gradlew

      - name: Build APK
        working-directory: extracted/androidproj
        run: ./gradlew --no-daemon assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Korean-Shadowing-Studio-APK
          path: extracted/androidproj/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
